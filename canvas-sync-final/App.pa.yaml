App:
  Properties:
    OnStart: |-
      =Set(varTestMode, Coalesce(LookUp(CD_Setting, Title = "CD_TestMode").SettingValue, "Yes") = "Yes");
      Set(varAiEnabled, Coalesce(LookUp(CD_Setting, Title = "aiEnabled").SettingValue, "Yes") = "Yes");
      Set(varAutoSendEnabled, Coalesce(LookUp(CD_Setting, Title = "autoSendEnabled").SettingValue, "No") = "Yes");
      Set(varFollowupEnabled, Coalesce(LookUp(CD_Setting, Title = "followupEnabled").SettingValue, "No") = "Yes");
      Set(varCallAiEnabled, Coalesce(LookUp(CD_Setting, Title = "callAiEnabled").SettingValue, "No") = "Yes");
      Set(varSubBatchSize, If(Value(Coalesce(LookUp(CD_Setting, Title = "SubBatchSize").SettingValue, "0")) <= 0, 25, Value(LookUp(CD_Setting, Title = "SubBatchSize").SettingValue)));
      Set(varAllowlist, ";" & Lower(Trim(Coalesce(LookUp(CD_Setting, Title = "sendTestAllowlist").SettingValue, ""))) & ";");
      Set(varSendable, "|" & Substitute(Coalesce(LookUp(CD_Setting, Title = "sendableEndResults").SettingValue, "NFBRK;FEBRK-JEENA;FEBRK-SUNIMPEX"), ";", "|") & "|");
      If(IsBlank(LookUp(CD_Setting, Title = "sendTestAllowlist")), Patch(CD_Setting, Defaults(CD_Setting), {Title: "sendTestAllowlist", SettingValue: "bipul.sikder@fedex.com", Description: "TEST MODE allow-list, semicolon separated. Only these recipients receive mail."}));
      If(IsBlank(LookUp(CD_Setting, Title = "SubBatchSize")), Patch(CD_Setting, Defaults(CD_Setting), {Title: "SubBatchSize", SettingValue: "25", Description: "Send sub-batch size"}));
      If(IsBlank(LookUp(CD_Setting, Title = "sendableEndResults")), Patch(CD_Setting, Defaults(CD_Setting), {Title: "sendableEndResults", SettingValue: "NFBRK;FEBRK-JEENA;FEBRK-SUNIMPEX", Description: "Semicolon separated end results eligible for pre-alert. Anything else is SKIPPED."}));
      If(IsBlank(LookUp(CD_Setting, Title = "CD_TestMode")), Patch(CD_Setting, Defaults(CD_Setting), {Title: "CD_TestMode", SettingValue: "Yes", Description: "Master inert switch"}));
      If(IsBlank(LookUp(CD_Setting, Title = "aiEnabled")), Patch(CD_Setting, Defaults(CD_Setting), {Title: "aiEnabled", SettingValue: "Yes", Description: "AI classification enabled"}));
      If(IsBlank(LookUp(CD_Setting, Title = "autoSendEnabled")), Patch(CD_Setting, Defaults(CD_Setting), {Title: "autoSendEnabled", SettingValue: "No", Description: "Master send switch"}));
      If(IsBlank(LookUp(CD_Setting, Title = "followupEnabled")), Patch(CD_Setting, Defaults(CD_Setting), {Title: "followupEnabled", SettingValue: "No", Description: "Automatic reminder follow-ups"}));
      If(IsBlank(LookUp(CD_Setting, Title = "callAiEnabled")), Patch(CD_Setting, Defaults(CD_Setting), {Title: "callAiEnabled", SettingValue: "No", Description: "Call AI assist"}));
      If(IsBlank(LookUp(CD_Template, Title = "NFBRK")), Patch(CD_Template, Defaults(CD_Template), {Title: "NFBRK", SubjectPattern: "Pre Alert - {AWB} / {CONSIGNEE_NAME}", BodyContent: "<p>Dear {CONSIGNEE_NAME},</p><p>AWB {AWB} | Freight {FREIGHT} {CURRENCY} | To {LOCATION}</p><p>Send the documents before the BOE window. Late documents attract Rs. 10,000/day.</p><p>Regards,<br/>FedEx Cargo Desk</p>", CCEmails: "", SubjectTagEnabled: true, Active: true}));
      If(IsBlank(LookUp(CD_Template, Title = "FEBRK-JEENA")), Patch(CD_Template, Defaults(CD_Template), {Title: "FEBRK-JEENA", SubjectPattern: "CARGO ARRIVAL NOTICE- Pre Alert AWB and freight charges : {AWB} {CONSIGNEE_NAME} {FREIGHT}_{CURRENCY} | FEBRK-DDP", BodyContent: "<p>Dear {CONSIGNEE_NAME},</p><p>Broker: Jeena.</p><p>AWB {AWB} | Freight {FREIGHT} {CURRENCY} | To {LOCATION}</p><p>Send the documents before the BOE window. Late documents attract Rs. 10,000/day.</p><p>Regards,<br/>FedEx Cargo Desk</p>", CCEmails: "del-fedex.imports@jeena.co.in; madhikari@jeena.co.in; syogesh@jeena.co.in; adtaneja@jeena.co.in; sdutt@jeena.co.in; vjain1@jeena.co.in; ssingh@jeena.co.in; aanand1@jeena.co.in; kbihari@jeena.co.in; iphvdelcargo@corp.ds.fedex.com", SubjectTagEnabled: true, Active: true}));
      If(IsBlank(LookUp(CD_Template, Title = "FEBRK-SUNIMPEX")), Patch(CD_Template, Defaults(CD_Template), {Title: "FEBRK-SUNIMPEX", SubjectPattern: "CARGO ARRIVAL NOTICE- Pre Alert AWB and freight charges : {AWB} {CONSIGNEE_NAME} {FREIGHT}_{CURRENCY} | FEBRK-DDU", BodyContent: "<p>Dear {CONSIGNEE_NAME},</p><p>Broker: Sunimpex.</p><p>AWB {AWB} | Freight {FREIGHT} {CURRENCY} | To {LOCATION}</p><p>Send the documents before the BOE window. Late documents attract Rs. 10,000/day.</p><p>Regards,<br/>FedEx Cargo Desk</p>", CCEmails: "", SubjectTagEnabled: true, Active: true}));
      If(IsBlank(LookUp(CD_Batch, Title = "BATCH-20261022-0930-UBOND")), Patch(CD_Batch, Defaults(CD_Batch), {Title: "BATCH-20261022-0930-UBOND", RowCountIn: 6, AcceptedCount: 5, RejectedCount: 1, SentCount: 0, DocsReceivedCount: 0, ClosedCount: 0, SubBatchSize: 25, UploadedAt: Now()}));
      If(IsBlank(LookUp(CD_Batch, Title = "BATCH-20261022-0945-CONSOL")), Patch(CD_Batch, Defaults(CD_Batch), {Title: "BATCH-20261022-0945-CONSOL", RowCountIn: 1, AcceptedCount: 1, RejectedCount: 0, SentCount: 0, DocsReceivedCount: 0, ClosedCount: 0, SubBatchSize: 25, UploadedAt: Now()}));
      If(IsBlank(LookUp(CD_Shipment, Title = "781234567890")), Patch(CD_Shipment, Defaults(CD_Shipment), {Title: "781234567890", RawJSON: "{""Batch"":""BATCH-20261022-0930-UBOND"",""AWB"":""781234567890"",""Company"":""Alpha Imports Pvt Ltd"",""Email"":""bipul.sikder@fedex.com"",""EndResult"":""NFBRK"",""Broker"":""JEENA"",""Location"":""DELHI"",""Freight"":""45000"",""Currency"":""INR""}", Freight: 45000, FeeINR: 3068, FeeBasis: "3068 = base + 18% GST", Summary: "Alpha Imports Pvt Ltd - NFBRK", TestMode: true, ReminderCount: 0, CustomerResponded: false, CreatedAt: Now(), UpdatedAt: Now()}));
      If(IsBlank(LookUp(CD_Shipment, Title = "781234567891")), Patch(CD_Shipment, Defaults(CD_Shipment), {Title: "781234567891", RawJSON: "{""Batch"":""BATCH-20261022-0930-UBOND"",""AWB"":""781234567891"",""Company"":""Meridian Textiles"",""Email"":""ops@meridiantextiles.example"",""EndResult"":""FEBRK-JEENA"",""Broker"":""JEENA"",""Location"":""KOLKATA"",""Freight"":""98000"",""Currency"":""INR""}", Freight: 98000, FeeINR: 4248, FeeBasis: "4248 = base + 18% GST", Summary: "Meridian Textiles - FEBRK-JEENA", TestMode: true, ReminderCount: 0, CustomerResponded: false, CreatedAt: Now(), UpdatedAt: Now()}));
      If(IsBlank(LookUp(CD_Shipment, Title = "781234567892")), Patch(CD_Shipment, Defaults(CD_Shipment), {Title: "781234567892", RawJSON: "{""Batch"":""BATCH-20261022-0930-UBOND"",""AWB"":""781234567892"",""Company"":""Bharat Electronics"",""Email"":""ops@bharetelectronics.example"",""EndResult"":""FEBRK-SUNIMPEX"",""Broker"":""SUNIMPEX"",""Location"":""DELHI"",""Freight"":""22000"",""Currency"":""INR""}", Freight: 22000, FeeINR: 3068, FeeBasis: "3068 = base + 18% GST", Summary: "Bharat Electronics - FEBRK-SUNIMPEX", TestMode: true, ReminderCount: 0, CustomerResponded: false, CreatedAt: Now(), UpdatedAt: Now()}));
      If(IsBlank(LookUp(CD_Shipment, Title = "781234567893")), Patch(CD_Shipment, Defaults(CD_Shipment), {Title: "781234567893", RawJSON: "{""Batch"":""BATCH-20261022-0930-UBOND"",""AWB"":""781234567893"",""Company"":""Arihant Metals"",""Email"":""ops@arihantmetals.example"",""EndResult"":""FEBRK"",""Broker"":"""",""Location"":""DELHI"",""Freight"":""61000"",""Currency"":""INR""}", Freight: 61000, FeeINR: 0, FeeBasis: "", Summary: "Arihant Metals - FEBRK", TestMode: true, ReminderCount: 0, CustomerResponded: false, CreatedAt: Now(), UpdatedAt: Now()}));
      If(IsBlank(LookUp(CD_Shipment, Title = "781234567894")), Patch(CD_Shipment, Defaults(CD_Shipment), {Title: "781234567894", RawJSON: "{""Batch"":""BATCH-20261022-0930-UBOND"",""AWB"":""781234567894"",""Company"":""Zenith Exports"",""Email"":"""",""EndResult"":""NFBRK"",""Broker"":""JEENA"",""Location"":""DELHI"",""Freight"":""31000"",""Currency"":""INR""}", Freight: 31000, FeeINR: 0, FeeBasis: "", Summary: "Zenith Exports - NFBRK", TestMode: true, ReminderCount: 0, CustomerResponded: false, CreatedAt: Now(), UpdatedAt: Now(), RejectReason: "Consignee email missing or malformed"}));
      If(IsBlank(LookUp(CD_Shipment, Title = "781234567896")), Patch(CD_Shipment, Defaults(CD_Shipment), {Title: "781234567896", RawJSON: "{""Batch"":""BATCH-20261022-0930-UBOND"",""AWB"":""781234567896"",""Company"":""Orbit Freight Solutions"",""Email"":""ops@orbitfreight.example"",""EndResult"":""HOLD"",""Broker"":"""",""Location"":""MUMBAI"",""Freight"":""12000"",""Currency"":""INR""}", Freight: 12000, FeeINR: 0, FeeBasis: "", Summary: "Orbit Freight Solutions - HOLD", TestMode: true, ReminderCount: 0, CustomerResponded: false, CreatedAt: Now(), UpdatedAt: Now()}));
      If(IsBlank(LookUp(CD_Shipment, Title = "781234567895")), Patch(CD_Shipment, Defaults(CD_Shipment), {Title: "781234567895", RawJSON: "{""Batch"":""BATCH-20261022-0945-CONSOL"",""AWB"":""781234567895"",""Company"":""Kirti Overseas"",""Email"":""docs@kirtioverseas.example"",""EndResult"":""NFBRK"",""Broker"":""JEENA"",""Location"":""KOLKATA"",""Freight"":""54000"",""Currency"":""INR""}", Freight: 54000, FeeINR: 3068, FeeBasis: "3068 = base + 18% GST", Summary: "Kirti Overseas - NFBRK", TestMode: true, ReminderCount: 0, CustomerResponded: false, CreatedAt: Now(), UpdatedAt: Now()}));
      If(IsBlank(LookUp(CD_Case, Title = "CASE-000001")), Patch(CD_Case, Defaults(CD_Case), {Title: "CASE-000001", Reason: "AWB 781234567893 - Broker unresolved: bare FEBRK without Jeena or Sunimpex", Fix: "Confirm the broker, then unblock every AWB on that line", CreatedAt: Now(), SlaDueAt: Now() + 4/24}));
      If(IsBlank(LookUp(CD_Case, Title = "CASE-000002")), Patch(CD_Case, Defaults(CD_Case), {Title: "CASE-000002", Reason: "AWB 781234567894 - Consignee email missing or malformed", Fix: "Re-upload the row with a valid consignee email address", CreatedAt: Now(), SlaDueAt: Now() + 8/24}));
      ClearCollect(colBatch, CD_Batch);
      ClearCollect(colCase, CD_Case);
      ClearCollect(colShipment, CD_Shipment);
      ClearCollect(colTemplate, CD_Template);
      ClearCollect(colMessage, CD_Message)
    StartScreen: =ScrHome
    Theme: =PowerAppsTheme
