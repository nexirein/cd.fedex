Screens:
  ScrBatchBoard:
    Properties:
      Fill: =RGBA(245, 246, 248, 1)
      OnVisible: |-
        =Set(varTestMode, Coalesce(LookUp(CD_Setting, Title = "CD_TestMode").SettingValue, "Yes") = "Yes");
        Set(varAllowlist, ";" & Lower(Trim(Coalesce(LookUp(CD_Setting, Title = "sendTestAllowlist").SettingValue, ""))) & ";");
        Set(varSubBatchSize, If(Value(Coalesce(LookUp(CD_Setting, Title = "SubBatchSize").SettingValue, "0")) <= 0, 25, Value(LookUp(CD_Setting, Title = "SubBatchSize").SettingValue)));
        Set(varSendable, "|" & Substitute(Coalesce(LookUp(CD_Setting, Title = "sendableEndResults").SettingValue, "NFBRK;FEBRK-JEENA;FEBRK-SUNIMPEX"), ";", "|") & "|");
        Set(varBdBatch, Coalesce(LookUp(SortByColumns(colBatch, "UploadedAt", SortOrder.Descending), Title <> "").Title, ""));
        Set(varBdSel, Blank());
        Set(varBdSendState, "IDLE");
        Set(varBdSentCount, 0);
        Set(varBdSubBatch, 0);
        Set(varBdSubBatches, 0);
        Set(varBdReadyCount, 0);
        Set(varBdBlockedCount, 0);
        ClearCollect(colBdAll, AddColumns(AddColumns(AddColumns(AddColumns(AddColumns(AddColumns(Filter(DropColumns(colShipment, Title), !IsBlank(RawJSON) && Text(ParseJSON(RawJSON).Batch) = varBdBatch),
            Awb, Text(ParseJSON(RawJSON).AWB),
            Company, Text(ParseJSON(RawJSON).Company),
            Email, Text(ParseJSON(RawJSON).Email),
            EndResult, Text(ParseJSON(RawJSON).EndResult),
            Broker, Text(ParseJSON(RawJSON).Broker),
            Location, Text(ParseJSON(RawJSON).Location),
            FreightTxt, Text(ParseJSON(RawJSON).Freight),
            Currency, Text(ParseJSON(RawJSON).Currency),
            BatchKey, Text(ParseJSON(RawJSON).Batch)),
            AwbOk, !IsBlank(Trim(Awb)) && Len(Trim(Awb)) >= 11 && Len(Trim(Awb)) <= 12,
            EmailOk, !IsBlank(Trim(Email)) && (Find("@", Lower(Trim(Email))) > 0),
            Sendable, Find("|" & Trim(EndResult) & "|", varSendable) > 0,
            TplName, If(Find("|" & Trim(EndResult) & "|", varSendable) = 0, "", If(EndResult = "NFBRK", "NFBRK", If(Broker = "JEENA", "FEBRK-JEENA", If(Broker = "SUNIMPEX", "FEBRK-SUNIMPEX", ""))))),
            TplSubject, LookUp(colTemplate, Title = TplName).SubjectPattern,
            TplBody, LookUp(colTemplate, Title = TplName).BodyContent,
            TplCc, LookUp(colTemplate, Title = TplName).CCEmails,
            TplTag, LookUp(colTemplate, Title = TplName).SubjectTagEnabled,
            CaseTitle, LookUp(colCase, Find(Awb, Reason) > 0).Title),
            PfRecipient, If(IsBlank(Trim(Email)), "missing", If(EmailOk, "valid", "bad email")),
            PfType, If(IsBlank(Trim(EndResult)), "unresolved", Trim(EndResult)),
            PfMissing, If(IsBlank(Trim(Awb)), ", AWB", "") & If(IsBlank(Trim(Company)), ", CONSIGNEE_NAME", "") & If(IsBlank(Trim(FreightTxt)), ", FREIGHT", "") & If(IsBlank(Trim(Currency)), ", CURRENCY", "") & If(IsBlank(Trim(Location)), ", LOCATION", "") & If(IsBlank(TplSubject), ", TEMPLATE", "")),
            PfPlaceholders, If(!Sendable, "n/a — " & Trim(EndResult), If(IsBlank(PfMissing), "all set", Trim(PfMissing) & " missing")),
            PfResult, If(!Sendable, "SKIPPED", If(AwbOk && EmailOk && IsBlank(PfMissing), "PASS", "BLOCKED"))),
            PfReason, If(PfResult = "PASS", "", If(!Sendable, "End result " & Trim(EndResult) & " is not on the sendable list. " & If(Trim(EndResult) = "HOLD", "On hold — do not pre-alert. ", "") & If(Trim(EndResult) = "Calling", "Marked Calling — a call has to clear this first. ", "") & If(Trim(EndResult) = "FEBRK", "Bare FEBRK — name the broker, then set it to FEBRK-JEENA or FEBRK-SUNIMPEX. ", ""), If(!AwbOk, "AWB missing or malformed. ", "") & If(!EmailOk, "Consignee email missing or malformed. ", "") & If(!IsBlank(PfMissing), "Placeholder missing: " & PfMissing & ". ", ""))),
            PfFix, If(PfResult = "PASS", "", If(!Sendable, If(Trim(EndResult) = "HOLD", "Release the hold, then re-run pre-flight. ", If(Trim(EndResult) = "Calling", "Complete the call and update the end result. ", If(Trim(EndResult) = "FEBRK", "Confirm the broker for this AWB, then unblock the line. ", "If this type should be pre-alerted, add it to the sendableEndResults setting. "))), If(!AwbOk, "Re-upload the row with an 11 or 12 digit AWB. ", "") & If(!EmailOk, "Re-upload the row with a valid consignee email. ", "") & If(!IsBlank(PfMissing), "Supply the missing value and re-run pre-flight. ", ""))),
            RenderSubject, Substitute(Substitute(Substitute(Substitute(Substitute(TplSubject, "{AWB}", Awb), "{CONSIGNEE_NAME}", Company), "{FREIGHT}", FreightTxt), "{CURRENCY}", Currency), "{LOCATION}", Location) & If(!IsBlank(CaseTitle) && TplTag = true, " [" & CaseTitle & "]", ""),
            RenderBody, Substitute(Substitute(Substitute(Substitute(Substitute(TplBody, "{AWB}", Awb), "{CONSIGNEE_NAME}", Company), "{FREIGHT}", FreightTxt), "{CURRENCY}", Currency), "{LOCATION}", Location)));
        Set(varBdReadyCount, CountRows(Filter(colBdAll, BatchKey = varBdBatch && PfResult = "PASS")));
        Set(varBdBlockedCount, CountRows(Filter(colBdAll, BatchKey = varBdBatch && PfResult = "BLOCKED")));
        Set(varBdSubBatches, If(varBdReadyCount = 0, 0, RoundUp(varBdReadyCount / varSubBatchSize, 0)));
        Set(varBdSel, If(CountRows(Filter(colBdAll, BatchKey = varBdBatch)) > 0, First(Filter(colBdAll, BatchKey = varBdBatch)), Blank()))
