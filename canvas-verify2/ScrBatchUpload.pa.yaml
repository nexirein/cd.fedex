Screens:
  ScrBatchUpload:
    Properties:
      Fill: =RGBA(245, 246, 248, 1)
    Children:
      - conScrBatchUploadStub:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.Height - 96
            RadiusBottomLeft: =14
            RadiusBottomRight: =14
            RadiusTopLeft: =14
            RadiusTopRight: =14
            Width: =Parent.Width - 96
            X: =48
            Y: =48
          Children:
            - lblScrBatchUploadTitle:
                Control: ModernText
                Properties:
                  AccessibleLabel: ="Upload batch"
                  Color: =RGBA(26, 26, 26, 1)
                  FontWeight: =FontWeight.Semibold
                  Height: =40
                  Size: =24
                  Text: ="Upload batch"
                  Width: =760
                  X: =28
                  Y: =26
            - lblScrBatchUploadState:
                Control: ModernText
                Properties:
                  AccessibleLabel: ="Next build step"
                  Color: =RGBA(214, 74, 0, 1)
                  FontWeight: =FontWeight.Semibold
                  Height: =28
                  Size: =13
                  Text: ="Next build step"
                  Width: =300
                  X: =28
                  Y: =72
            - lblScrBatchUploadNote:
                Control: ModernText
                Properties:
                  AccessibleLabel: ="Why upload is not built yet"
                  Color: =RGBA(90, 90, 102, 1)
                  Height: =90
                  Text: ="This is where a UBOND or CONSOL workbook becomes shipments. It is not wired yet because the typed columns it must write to do not exist until the reconcile script runs. Until then it says so plainly rather than accepting a file and losing it."
                  Width: =780
                  X: =28
                  Y: =104
            - lblScrBatchUploadRulesHead:
                Control: ModernText
                Properties:
                  AccessibleLabel: ="Confirmed from your real file"
                  Color: =RGBA(26, 26, 26, 1)
                  FontWeight: =FontWeight.Semibold
                  Height: =28
                  Text: ="Confirmed from your real file"
                  Width: =500
                  X: =28
                  Y: =196
            - lblScrBatchUploadRule1:
                Control: ModernText
                Properties:
                  AccessibleLabel: ="Email comes from Standard Remarks"
                  Color: =RGBA(90, 90, 102, 1)
                  Height: =52
                  Size: =14
                  Text: ="1. The consignee email lives in the Standard Remarks column. ConsigneeEmailID holds a phone number in your rows, so it is never read as an address."
                  Width: =780
                  X: =28
                  Y: =228
            - lblScrBatchUploadRule2:
                Control: ModernText
                Properties:
                  AccessibleLabel: ="HOLD Calling and bare FEBRK are not sendable"
                  Color: =RGBA(90, 90, 102, 1)
                  Height: =52
                  Size: =14
                  Text: ="2. HOLD, Calling and a bare FEBRK are not pre-alert types. They are recorded as not sendable, with the reason, instead of being counted as data errors."
                  Width: =780
                  X: =28
                  Y: =282
            - lblScrBatchUploadRule3:
                Control: ModernText
                Properties:
                  AccessibleLabel: ="Broker must be named, never guessed"
                  Color: =RGBA(90, 90, 102, 1)
                  Height: =52
                  Size: =14
                  Text: ="3. FedEx Broker is empty or 0 in every row you sent, so a broker has to be named before a FEBRK row can send. The import never guesses one."
                  Width: =780
                  X: =28
                  Y: =336
            - btnScrBatchUploadBack:
                Control: ModernButton
                Properties:
                  AccessibleLabel: ="Back to Home"
                  BasePaletteColor: =RGBA(77, 20, 140, 1)
                  Height: =44
                  Layout: =ButtonLayout.TextOnly
                  OnSelect: =Navigate(ScrHome, ScreenTransition.None)
                  Text: ="Back to Home"
                  Width: =180
                  X: =28
                  Y: =404
